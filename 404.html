<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F4F2EC; color: #111111; font-family: system-ui, sans-serif; text-align: center; }
    main { padding: 24px; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 24px; margin: 0 0 16px; }
    a { color: #1F3FD1; }
  </style>
  <script>
    // Paths inside the app load the app's own page while the address bar keeps the route,
    // so a refresh on a deep link lands on the same screen.
    (function () {
      var appBase = '/Cuidance_Prototype/app/';
      if (location.pathname.indexOf(appBase) !== 0) return;
      fetch(appBase + 'index.html')
        .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
        .then(function (html) { document.open(); document.write(html); document.close(); })
        .catch(function () { location.replace(appBase); });
    })();
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>We could not find that page.</p>
    <p><a href="https://alyssaramirez601.github.io/Cuidance_Prototype/">Go to the Cuidance prototype</a></p>
  </main>
</body>
</html>
